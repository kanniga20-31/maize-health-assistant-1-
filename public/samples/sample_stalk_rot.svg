<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3624"/>
      <stop offset="50%" stop-color="#3a4530"/>
      <stop offset="100%" stop-color="#1e2417"/>
    </linearGradient>
    <!-- Stalk Outer Rind -->
    <linearGradient id="rindGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a6839"/>
      <stop offset="15%" stop-color="#8da35c"/>
      <stop offset="50%" stop-color="#b8c983"/>
      <stop offset="85%" stop-color="#8da35c"/>
      <stop offset="100%" stop-color="#4d592e"/>
    </linearGradient>
    <!-- Internal Disintegrated Pith (Fusarium / Gibberella Pink & Brown Decay) -->
    <linearGradient id="pithDecay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9caa7"/>
      <stop offset="25%" stop-color="#d18a82"/>
      <stop offset="50%" stop-color="#ad4e52"/>
      <stop offset="75%" stop-color="#693026"/>
      <stop offset="100%" stop-color="#401e17"/>
    </linearGradient>
    <radialGradient id="nodeRot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#361710"/>
      <stop offset="60%" stop-color="#592b21"/>
      <stop offset="100%" stop-color="#804130"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background field setting -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Lower Soil & Stalk Roots (Brace Roots) -->
  <path d="M 320 540 Q 260 570 200 600" stroke="#8c7353" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M 340 550 Q 300 580 270 600" stroke="#755e42" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M 480 540 Q 540 570 600 600" stroke="#8c7353" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M 460 550 Q 500 580 530 600" stroke="#755e42" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M 390 560 L 410 600" stroke="#5e4933" stroke-width="16" stroke-linecap="round"/>

  <!-- Main Stalk Outer Cylinder -->
  <rect x="330" y="30" width="140" height="520" rx="14" fill="url(#rindGrad)"/>
  
  <!-- Stalk Node Rings (Joints) -->
  <!-- Top Node -->
  <ellipse cx="400" cy="110" rx="72" ry="10" fill="#424d26" opacity="0.9"/>
  <ellipse cx="400" cy="108" rx="70" ry="7" fill="#75824b"/>
  <!-- Middle Node -->
  <ellipse cx="400" cy="270" rx="73" ry="12" fill="#3a2518" opacity="0.95"/>
  <ellipse cx="400" cy="268" rx="71" ry="8" fill="#543825"/>
  <!-- Lower Node (Severe Rot & Collapse) -->
  <ellipse cx="400" cy="430" rx="74" ry="14" fill="#2d1710" opacity="0.98"/>
  <ellipse cx="400" cy="428" rx="72" ry="9" fill="#4d2417"/>

  <!-- Stalk Longitudinal Split Window (Showing Internal Pith Breakdown) -->
  <path d="M 348 60 Q 352 270 348 490 Q 400 500 452 490 Q 448 270 452 60 Z" fill="#c7bba0" stroke="#485429" stroke-width="3"/>
  <path d="M 354 75 Q 358 270 354 475 Q 400 484 446 475 Q 442 270 446 75 Z" fill="url(#pithDecay)"/>

  <!-- Shredded Vascular Bundles (White & Gray fibers in disintegrated pith) -->
  <g stroke="#e0d6c3" stroke-width="2.5" opacity="0.8" stroke-linecap="round">
    <path d="M 370 90 L 372 170 M 373 190 L 368 250 M 371 280 L 369 390 M 372 410 L 370 460"/>
    <path d="M 388 85 L 390 160 M 389 180 L 391 250 M 388 280 L 390 380 M 389 400 L 388 470"/>
    <path d="M 405 92 L 403 165 M 404 185 L 406 255 M 405 285 L 403 395 M 404 415 L 405 465"/>
    <path d="M 425 88 L 424 160 M 426 180 L 423 250 M 425 280 L 427 385 M 424 405 L 426 468"/>
  </g>

  <!-- Gibberella / Fusarium Salmon-Pink & Carmine Mycelial Discoloration -->
  <g filter="url(#softGlow)" opacity="0.75">
    <ellipse cx="400" cy="200" rx="35" ry="50" fill="#c74659"/>
    <ellipse cx="385" cy="240" rx="28" ry="40" fill="#db5c6c"/>
    <ellipse cx="415" cy="330" rx="30" ry="60" fill="#b83748"/>
    <ellipse cx="395" cy="360" rx="36" ry="45" fill="#cf4c5e"/>
  </g>

  <!-- Necrotic Dark Brown / Black Rot Cavities (Hollowing of Internodes) -->
  <ellipse cx="400" cy="430" rx="42" ry="26" fill="url(#nodeRot)"/>
  <ellipse cx="400" cy="270" rx="38" ry="20" fill="url(#nodeRot)"/>
  <ellipse cx="390" cy="340" rx="25" ry="35" fill="#2d130d" opacity="0.9"/>
  <ellipse cx="410" cy="450" rx="28" ry="30" fill="#1f0c08" opacity="0.95"/>

  <!-- Charcoal Rot Peppery Black Microsclerotia Specs -->
  <g fill="#1a110d" opacity="0.85">
    <circle cx="365" cy="310" r="1.5"/><circle cx="372" cy="325" r="2"/><circle cx="368" cy="340" r="1.8"/>
    <circle cx="420" cy="315" r="2"/><circle cx="432" cy="330" r="1.6"/><circle cx="426" cy="355" r="2.2"/>
    <circle cx="395" cy="380" r="1.8"/><circle cx="405" cy="390" r="2.5"/><circle cx="385" cy="405" r="2"/>
    <circle cx="415" cy="415" r="1.7"/><circle cx="375" cy="440" r="2.3"/><circle cx="425" cy="445" r="2"/>
  </g>

  <!-- Diagnostic Callout Overlay / Title Badge -->
  <rect x="24" y="24" width="310" height="74" rx="8" fill="#111813" opacity="0.88" stroke="#334235" stroke-width="1.5"/>
  <text x="40" y="52" fill="#f87171" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Maize Stalk Rot (தண்டு அழுகல்)</text>
  <text x="40" y="74" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Fusarium / Gibberella • Pith Decay &amp; Lodging</text>

  <!-- Anatomical Pointer for Split Pith -->
  <path d="M 280 230 L 350 230" stroke="#f87171" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="150" y="212" width="124" height="36" rx="6" fill="#1f2937" stroke="#f87171" stroke-width="1"/>
  <text x="160" y="234" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Disintegrated Pith</text>

  <!-- Anatomical Pointer for Rotting Node -->
  <rect x="150" y="416" width="124" height="36" rx="6" fill="#1f2937" stroke="#ef4444" stroke-width="1"/>
  <text x="160" y="438" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Rotting Lower Node</text>
  <path d="M 280 434 L 350 434" stroke="#ef4444" stroke-width="2"/>
</svg>
